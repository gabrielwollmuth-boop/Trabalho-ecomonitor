<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EcoMonitor Industrial</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <span class="logo-text">EcoMonitor</span>
        </div>
        <h2>Acesso ao Sistema</h2>
        <p>Monitorização Industrial — Linha 3</p>
      </div>

      <form id="loginForm" onsubmit="realizarLogin(event)" class="login-form">
        <div class="form-group">
          <label for="loginUser">Utilizador / Perfil</label>
          <select id="loginUser" required>
            <option value="Felipe">Felipe (tec. Produção)</option>
            <option value="Mariana">Gabriel (Téc. Segurança)</option>
            <option value="Carlos">Rodrigo (CO)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="loginPass">Palavra-passe</label>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>

        <div id="loginError" class="login-error" style="display: none;">
          Palavra-passe incorreta. Tente novamente.
        </div>

        <button type="submit" class="btn-primary btn-block">Entrar no Painel</button>
      </form>
      
      <div class="login-footer">
        
      </div>
    </div>
  </div>

  <script>
    function realizarLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;
      const errorDiv = document.getElementById('loginError');

      // Validação simples de credenciais
      if (pass === '12345678' || pass === 'admin' || pass.length >= 4) {
        localStorage.setItem('ecomonitor_user', user);
        window.location.href = 'index.html';
      } else {
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
